[project]
name = "gds-idea-cdk-constructs"
description = "A repo for commonly used constructs in the team."
readme = "README.md"
authors = [
    { name = "David Gillespie", email = "david.gillespie@digital.cabinet-office.gov.uk" },
    { name = "Jose Orjales", email = "jose.orjales@digital.cabinet-office.gov.uk" },
]
requires-python = ">=3.11"
dependencies = [
    "aws-cdk-aws-bedrock-agentcore-alpha>=2.261.0a0",
    "aws-cdk-lib>=2.243.0",
    "boto3>=1.43.47",
]
dynamic = ["version"]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pre-commit>=4.3.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.21",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.6.0",
    "mkdocstrings[python]>=0.28.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
]

[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/.venv/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]


[tool.ruff]
# Target Python version (e.g., Python 3.10)
target-version = "py312"

# Exclude files or directories
exclude = [
    ".git",
    "__pypackages__",
    ".mypy_cache",
    ".pytest_cache",
    ".venv",
    "venv",
    "src/gds_idea_cdk_constructs/agent_core/agent_template",
]
extend-exclude = ["src/gds_idea_cdk_constructs/_version.py"]

[tool.ruff.lint]
# Enable specific rule sets by their prefix
# E (Pycodestyle errors), F (Pyflakes), I (isort), B (Bugbear), UP (Pyupgrade), etc.
select = ["E", "F", "I", "B", "UP", "N", "A", "PT"]

# Configure the 'isort' rule set (I)
[tool.ruff.lint.isort]
force-single-line = false
combine-as-imports = true

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/gds_idea_cdk_constructs/_version.py"

[tool.gds-idea-app-kit]
framework = "python"
app_name = "gds-idea-cdk-constructs"
tool_version = "0.5.3"

