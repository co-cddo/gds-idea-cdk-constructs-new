[project]
name = "gds-idea-cdk-constructs"
version = "0.4.1"
description = "A repo for commonly used constructs in the team."
readme = "README.md"
authors = [
    { name = "David Gillespie", email = "david.gillespie@digital.cabinet-office.gov.uk" },
    { name = "Jose Orjales", email = "jose.orjales@digital.cabinet-office.gov.uk" },
]
requires-python = ">=3.11"
dependencies = [
    "aws-cdk-lib>=2.243.0",
    "boto3>=1.35.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pre-commit>=4.3.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.0",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.6.0",
    "mkdocstrings[python]>=0.28.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
]

[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/.venv/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]


[tool.ruff]
# Target Python version (e.g., Python 3.10)
target-version = "py312"

# Exclude files or directories
exclude = [
    ".git",
    "__pypackages__",
    ".mypy_cache",
    ".pytest_cache",
    ".venv",
    "venv",
]

[tool.ruff.lint]
# Enable specific rule sets by their prefix
# E (Pycodestyle errors), F (Pyflakes), I (isort), B (Bugbear), UP (Pyupgrade), etc.
select = ["E", "F", "I", "B", "UP", "N", "A", "PT"]

# Configure the 'isort' rule set (I)
[tool.ruff.lint.isort]
force-single-line = false
combine-as-imports = true
