site_name: gds-idea-cdk-constructs
site_description: Reusable AWS CDK constructs for deploying containerized web applications
site_url: https://co-cddo.github.io/gds-idea-cdk-constructs-new/
repo_url: https://github.com/co-cddo/gds-idea-cdk-constructs-new
repo_name: co-cddo/gds-idea-cdk-constructs-new

theme:
  name: material
  palette:
    # Light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - API Reference:
      - Configuration: api/config.md
      - WebApp Stack: api/webapp.md
      - Static Site: api/static-site.md
      - Authentication: api/auth.md
      - Container Properties: api/props.md
  - Architecture Decisions:
      - Overview: adr/index.md
      - ADR-001 LRU Cache: adr/001-lru-cache-for-s3-reads.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            separate_signature: true
            show_signature_annotations: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
