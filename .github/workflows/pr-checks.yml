name: PR Checks

on:
  pull_request:
    branches: [main, dev]

jobs:
  version-check:
    name: Check Version Bump
    runs-on: ubuntu-latest

    # 👇 This job will ONLY run for PRs targeting 'main'
    if: github.base_ref == 'main'

    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4
        # We need fetch-depth: 0 to get all history for the base branch
        with:
          fetch-depth: 0

      - name: Check version has been bumped
        run: |
          # 1. Get version from your PR branch's file
          PR_VERSION=$(grep -oP '^version = "\K[^"]*' pyproject.toml)

          # 2. Get version from the target base branch ('main')
          # No need to fetch, checkout with fetch-depth: 0 already got it
          BASE_VERSION=$(git show origin/${{ github.base_ref }}:pyproject.toml | grep -oP '^version = "\K[^"]*')

          echo "Base version (main): $BASE_VERSION"
          echo "PR version: $PR_VERSION"

          # 3. Use sort -V to find the "lowest" version
          # This correctly handles "1.10.0" vs "1.9.0"
          LOWEST_VERSION=$(printf '%s\n' "$BASE_VERSION" "$PR_VERSION" | sort -V | head -n1)

          # 4. Check if the PR version is the lowest (or the same)
          if [ "$LOWEST_VERSION" == "$PR_VERSION" ]; then
            echo "❌ Version in pyproject.toml is not greater than base branch ('main')"
            echo "Base version: $BASE_VERSION"
            echo "PR version: $PR_VERSION"
            echo "Please update the version in pyproject.toml"
            exit 1
          fi

          echo "✅ Version bumped from $BASE_VERSION to $PR_VERSION"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run ruff check
        run: uv run ruff check .

      - name: Run ruff format check
        run: uv run ruff format --check .

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run tests with coverage
        run: uv run pytest --cov --cov-report=term-missing

